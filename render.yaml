# Render Blueprint: FitPro Backend

services:
  - type: web
    name: fitpro-backend
    env: node
    rootDir: backend
    branch: main
    autoDeploy: true
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://fitpro.vercel.app"