<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- Fondo -->
  <rect width="1080" height="1080" fill="#0f0f0f"/>

  <!-- Línea roja superior -->
  <rect x="0" y="0" width="1080" height="6" fill="#e11d48"/>

  <!-- Logo: dumbbell -->
  <rect x="390" y="88" width="18" height="52" rx="5" fill="#e11d48"/>
  <rect x="408" y="102" width="12" height="24" rx="3" fill="#c01040"/>
  <rect x="420" y="110" width="40" height="12" rx="4" fill="#c01040"/>
  <rect x="460" y="102" width="12" height="24" rx="3" fill="#c01040"/>
  <rect x="472" y="88" width="18" height="52" rx="5" fill="#e11d48"/>

  <!-- Logo: texto FitPro -->
  <text font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="52" y="150" text-anchor="middle" x="540">
    <tspan fill="#ffffff">Fit</tspan><tspan fill="#e11d48">Pro</tspan>
  </text>

  <!-- Divider -->
  <rect x="200" y="172" width="680" height="2" fill="#1f1f1f"/>

  <!-- Headline -->
  <text font-family="Arial, sans-serif" font-weight="800" font-size="58" fill="#ffffff" text-anchor="middle" x="540" y="268">Gestioná tus alumnos</text>
  <text font-family="Arial, sans-serif" font-weight="800" font-size="58" fill="#ffffff" text-anchor="middle" x="540" y="336">sin caos ni planillas</text>

  <!-- Subtitle -->
  <text font-family="Arial, sans-serif" font-weight="400" font-size="30" fill="#888888" text-anchor="middle" x="540" y="400">La plataforma para personal trainers</text>

  <!-- Divider 2 -->
  <rect x="200" y="432" width="680" height="2" fill="#1f1f1f"/>

  <!-- Feature cards -->
  <!-- Card 1 -->
  <rect x="80" y="460" width="440" height="110" rx="14" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1.5"/>
  <rect x="80" y="460" width="6" height="110" rx="3" fill="#e11d48"/>
  <text font-family="Arial, sans-serif" font-weight="700" font-size="26" fill="#ffffff" x="114" y="507">Rutinas con +400</text>
  <text font-family="Arial, sans-serif" font-weight="700" font-size="26" fill="#ffffff" x="114" y="540">ejercicios ilustrados</text>

  <!-- Card 2 -->
  <rect x="560" y="460" width="440" height="110" rx="14" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1.5"/>
  <rect x="560" y="460" width="6" height="110" rx="3" fill="#e11d48"/>
  <text font-family="Arial, sans-serif" font-weight="700" font-size="26" fill="#ffffff" x="594" y="507">Alumnos y pagos</text>
  <text font-family="Arial, sans-serif" font-weight="700" font-size="26" fill="#ffffff" x="594" y="540">en un solo lugar</text>

  <!-- Card 3 -->
  <rect x="80" y="594" width="440" height="110" rx="14" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1.5"/>
  <rect x="80" y="594" width="6" height="110" rx="3" fill="#e11d48"/>
  <text font-family="Arial, sans-serif" font-weight="700" font-size="26" fill="#ffffff" x="114" y="641">Seguimiento de</text>
  <text font-family="Arial, sans-serif" font-weight="700" font-size="26" fill="#ffffff" x="114" y="674">progreso en tiempo real</text>

  <!-- Card 4 -->
  <rect x="560" y="594" width="440" height="110" rx="14" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1.5"/>
  <rect x="560" y="594" width="6" height="110" rx="3" fill="#e11d48"/>
  <text font-family="Arial, sans-serif" font-weight="700" font-size="26" fill="#ffffff" x="594" y="641">Chat directo con</text>
  <text font-family="Arial, sans-serif" font-weight="700" font-size="26" fill="#ffffff" x="594" y="674">tus alumnos</text>

  <!-- Divider 3 -->
  <rect x="200" y="732" width="680" height="2" fill="#1f1f1f"/>

  <!-- CTA Badge -->
  <rect x="290" y="764" width="500" height="70" rx="35" fill="#e11d48"/>
  <text font-family="Arial, sans-serif" font-weight="800" font-size="28" fill="#ffffff" text-anchor="middle" x="540" y="807">Demo gratis → link en bio</text>

  <!-- Tagline -->
  <text font-family="Arial, sans-serif" font-weight="400" font-size="24" fill="#555555" text-anchor="middle" x="540" y="900">Tu panel. El panel de tu alumno.</text>
  <text font-family="Arial, sans-serif" font-weight="400" font-size="24" fill="#555555" text-anchor="middle" x="540" y="932">Todo conectado en tiempo real.</text>

  <!-- Línea roja inferior -->
  <rect x="0" y="1074" width="1080" height="6" fill="#e11d48"/>
</svg>
